[package]
name = "word-doc-qa"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.20", features = ["train", "ndarray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
xml-rs = "0.8"
rand = "0.8"
clap = { version = "4", features = ["derive"] }